# A comment that fmt drops: a flow collection over lines is not reformatted in place.
list: [a,
  b]"""

zon_commented = """
// A comment that set keeps.
.{ .port = 1 }"""

jsonc_commented = """
// A comment that set keeps.
{"port": 1}"""

