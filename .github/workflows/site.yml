# Publishes `zig build site-gifs` (the guide, the libraries, the component gallery with a GIF
# of each component, the command reference, and the API reference) to GitHub Pages on every
# push to master. The site holds everything the docs workflow publishes, which it replaces.
name: site

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      # `termancy record` draws the GIFs in a monospace font of the machine's.
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: zig build site-gifs --summary failures
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: zig-out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
